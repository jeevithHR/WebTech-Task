<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Document</title>
 <style>
  #a{
   height: 400px;
   width: 400px;
   border: 2px solid black;
   background-image: linear-gradient(#a30502,#f78b04);
  }
  #b{
   height: 400px;
   width: 400px;
   border: 2px solid black;
   background-image: linear-gradient(to left,#a30502,#f78b04);
  }
   #c{
   height: 400px;
   width: 400px;
   border: 2px solid black;
   background-image: linear-gradient(#a30502 20%,#f78b04 20%);
  }
 </style>
</head>
<body>
 <div id="a"></div>
 <br>
 <div id="b"></div>
 <br>
 <div id="c"></div>
</body>
</html>
